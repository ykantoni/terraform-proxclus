  name: postgres-standby
  namespace: postgres-standby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-standby
  template:
    metadata:
      labels:
        app: postgres-standby
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # See matching comment on postgres-primary above: OnRootMismatch
        # keeps a 0600 server.key from being widened back to 0660 by
        # Kubernetes' recursive fsGroup chmod on every pod (re)start.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
