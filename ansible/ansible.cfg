[defaults]
inventory       = inventory/production/hosts.yml
roles_path      = roles
retry_files_enabled = False
interpreter_python  = auto_silent
stdout_callback     = yaml

# Points at the vault password FILE, not the password itself. Create this file
# yourself (see README.md's "Vault setup") — it is never committed, and this
# path is read only if the file actually exists at run time (ansible-playbook
# still works with --ask-vault-pass if you'd rather not keep a password file).
vault_password_file = ~/.ansible/talos-proxmox-vault-pass

[privilege_escalation]
become        = False
become_method = sudo
