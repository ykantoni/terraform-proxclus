name: Terraform

on:
  pull_request:
  push:
    branches:
      - main
      - github

jobs:
  terraform:
    runs-on:
      - self-hosted
      - linux
      - terraform
      - proxmox

    env:
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_VE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan