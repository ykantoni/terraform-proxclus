# 1. Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-primary

---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-standby


# 2. Credentials (generate a random password, or swap in your own)
---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: OFIwSFUrZE
  POSTGRES_USER: yurick
kind: Secret
metadata:
  name: postgres-primary-credentials
  namespace: postgres-primary
type: Opaque

---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: OFIwSFUrZE
  POSTGRES_USER: yurick
kind: Secret
metadata:
  name: postgres-standby-credentials
  namespace: postgres-standby
type: Opaque

# 3. pg_hba.conf — declared here instead of hand-edited in the running pod,
#    so it survives pod/PVC recreation and changes go through `kubectl apply`.
#    Mounted as a directory (not subPath) so ConfigMap edits actually
#    propagate into the pod; Postgres still needs a reload to pick them up:
#      kubectl exec -n postgres-primary postgres-primary-0 -- \
#        psql -U yurick -c "SELECT pg_reload_conf();"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-primary-hba
  namespace: postgres-primary
data:
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS          METHOD
    local   all       all                    trust
    host    all       all   127.0.0.1/32     trust
    host    all       all   ::1/128          trust

    # Trusted LAN / gateway hosts — password-authenticated, not open trust
    host    all       all   192.168.1.0/24   scram-sha-256
    host    all       all   172.19.64.1/32   scram-sha-256

    # Replication
    local   replication  all                 trust
    host    replication  all  127.0.0.1/32   trust
    host    replication  all  ::1/128        trust

    # Everything else: password required
    host    all       all   all              scram-sha-256

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-standby-hba
  namespace: postgres-standby
data:
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS          METHOD
    local   all       all                    trust
    host    all       all   127.0.0.1/32     trust
    host    all       all   ::1/128          trust

    # Trusted LAN / gateway hosts — password-authenticated, not open trust
    host    all       all   192.168.1.0/24   scram-sha-256
    host    all       all   172.19.64.1/32   scram-sha-256

    # Replication
    local   replication  all                 trust
    host    replication  all  127.0.0.1/32   trust
    host    replication  all  ::1/128        trust

    # Everything else: password required
    host    all       all   all              scram-sha-256


# 4. PVC — uses the cluster's default StorageClass (longhorn)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-data
  namespace: postgres-primary
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-standby-data
  namespace: postgres-standby
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi


# 5. Deployment
#
#    Each StatefulSet's install-extensions initContainer apt-get installs
#    three extensions into a shared emptyDir, then the main container mounts
#    that staged content back over the real /usr/lib/postgresql/17/lib and
#    /usr/share/postgresql/17/extension directories:
#      - postgresql-plpython3-17 (+ its python3/libexpat deps, staged
#        separately since they don't belong under those two directories).
#        Verified against this exact image (postgres:17, Debian trixie/13,
#        Python 3.13.5, postgresql-plpython3-17 17.11) by installing it in a
#        scratch pod and confirming CREATE EXTENSION plpython3u loads and
#        runs. If a postgres:17 image rebuild ever bumps the bundled Python
#        minor version, the hardcoded "3.13" paths below need to move with
#        it — check with `kubectl exec <pod> -c install-extensions --
#        python3 --version` (add a temporary `sleep infinity` to the args to
#        keep it alive to check).
#      - postgresql-17-pldebugger (the pldbgapi extension, used by debugger
#        clients like pgAdmin to step through plpgsql functions). No extra
#        runtime libs needed — its only dependency, libc6, is already in the
#        image. The postgres container also sets
#        shared_preload_libraries=citus,plugin_debugger (see its args
#        below), which is required for indirect/global debugging (pgAdmin's
#        "Debug" button waiting on any session) — plain CREATE EXTENSION
#        pldbgapi alone only covers direct debugging.
#      - postgresql-17-citus-14.2 (sharding/distributed tables), pulled from
#        Citus's own apt repo (not in Debian/pgdg) via
#        install.citusdata.com/community/deb.sh — confirmed that script
#        supports this image's Debian trixie base. Citus ships ~90 files
#        (dozens of extension-upgrade .sql files plus citus.so,
#        citus_columnar.so, citus_pgoutput.so, citus_wal2json.so, and a
#        citus_decoders/ subdirectory), which is why this mounts the whole
#        lib/ and extension/ directories instead of naming files
#        individually the way earlier revisions of this manifest did —
#        nothing from the original image is hidden by that since the
#        initContainer copies each directory's *complete* post-install
#        contents (built-ins included), not just the new files.
#        shared_preload_libraries=citus is mandatory (not optional like
#        plugin_debugger) for Citus to load at all, and Citus's own docs say
#        to list it first when combined with other preloaded libraries.
#        citus.so also dynamically links libcurl.so.4 (plus libcurl's own
#        chain: libnghttp2, libnghttp3, libpsl, librtmp, libssh2,
#        libbrotlidec, libbrotlicommon) — none of which ship in the base
#        postgres:17 image, unlike the rest of libcurl's deps (libpq,
#        libssl, libcrypto, libgssapi_krb5, libldap, libsasl2, libgnutls,
#        libz, ...), which are already there for psql's own TLS/Kerberos/
#        LDAP support. Those 8 libs get staged into rtlib alongside the
#        Python runtime libs. First cut of this shipped without them (an
#        earlier scratch-pod check accidentally had libcurl already
#        installed for an unrelated reason — fetching the Citus repo script
#        — which masked the gap) and crash-looped with "could not load
#        library... libcurl.so.4: cannot open shared object file". Re-
#        verified faithfully this time: after installing everything, every
#        library apt pulled in that wasn't already in the base image was
#        deleted except the 8 above, then a real initdb + postgres start
#        with shared_preload_libraries=citus,plugin_debugger and only
#        LD_LIBRARY_PATH=/usr/local/lib/pgextra to resolve them — confirmed
#        CREATE EXTENSION citus / plpython3u / pldbgapi all succeed and
#        SELECT citus_version() returns "Citus 14.2.0".
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      # Pins the pod to the same non-root "postgres" user (uid/gid 999) the
      # official image already drops to internally via gosu — satisfies the
      # "restricted" PodSecurity standard instead of starting as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # Default fsGroupChangePolicy ("Always") recursively chmod g+rwX's
        # every file on the PVC on every mount/pod (re)start, which widens
        # server.key (needed if SSL is ever turned on) from 0600 to 0660 —
        # Postgres then refuses to start with "private key file... has group
        # or world access". OnRootMismatch skips that walk once the volume
        # root already has the right group, so a manually-fixed 0600 key
        # actually stays fixed across restarts.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-extensions
          image: postgres:17
          # Needs root to apt-get install — overrides the pod-level uid 999
          # pin above just for this container. Triggers the same "restricted"
          # PodSecurity warning the main container used to hit; harmless here
          # since it's advisory-only in this cluster (see securityContext
          # comment on this pod above).
          # No capabilities.drop here: apt-get needs CAP_SETUID/CAP_SETGID
          # (root -> its own "_apt" sandbox user) to fetch packages, so
          # dropping ALL breaks it — "Method http has died unexpectedly!".
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                curl ca-certificates gnupg lsb-release apt-transport-https \
                postgresql-plpython3-17 postgresql-17-pldebugger
              curl -sL https://install.citusdata.com/community/deb.sh | bash
              apt-get update -qq
              apt-get install -y --no-install-recommends postgresql-17-citus-14.2
              mkdir -p /pyext/pglib /pyext/ext /pyext/pylib /pyext/pyetc /pyext/rtlib
              cp -a /usr/lib/postgresql/17/lib/. /pyext/pglib/
              cp -a /usr/share/postgresql/17/extension/. /pyext/ext/
              cp -a /usr/lib/python3.13/. /pyext/pylib/
              cp -a /etc/python3.13/. /pyext/pyetc/
              cp -a /usr/lib/x86_64-linux-gnu/libpython3.13.so* \
                    /usr/lib/x86_64-linux-gnu/libexpat.so* /pyext/rtlib/
              # citus.so needs libcurl at runtime (and libcurl's own chain of
              # deps not already in the base image); the rest of libcurl's
              # ldd output — libpq, libssl, libcrypto, libgssapi_krb5,
              # libldap, libsasl2, libgnutls, libz, etc. — is already present
              # in postgres:17 (psql itself needs TLS/Kerberos/LDAP support),
              # confirmed by diffing base-image libs against libs added by
              # this install in a scratch pod.
              cp -a /usr/lib/x86_64-linux-gnu/libcurl.so* \
                    /usr/lib/x86_64-linux-gnu/libnghttp2.so* \
                    /usr/lib/x86_64-linux-gnu/libnghttp3.so* \
                    /usr/lib/x86_64-linux-gnu/libpsl.so* \
                    /usr/lib/x86_64-linux-gnu/librtmp.so* \
                    /usr/lib/x86_64-linux-gnu/libssh2.so* \
                    /usr/lib/x86_64-linux-gnu/libbrotlidec.so* \
                    /usr/lib/x86_64-linux-gnu/libbrotlicommon.so* /pyext/rtlib/
          volumeMounts:
            - name: pyext
              mountPath: /pyext
      containers:
        - name: postgres
          image: postgres:17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-primary-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib/pgextra
          # shared_preload_libraries: citus is mandatory for Citus to load at
          # all (and must come first per Citus's own docs when combined with
          # other preloaded libraries); plugin_debugger enables indirect/
          # global pldbgapi debugging (pgAdmin's "Debug" button waiting on
          # any session, not just one launched through the debugger). Both
          # .so files must already be in place at postmaster startup, which
          # they are since the install-extensions initContainer mounts them
          # before this container starts.
          args: ["-c", "hba_file=/etc/postgresql/custom/pg_hba.conf", "-c", "shared_preload_libraries=citus,plugin_debugger"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba-config
              mountPath: /etc/postgresql/custom
              readOnly: true
            - name: pyext
              mountPath: /usr/lib/postgresql/17/lib
              subPath: pglib
              readOnly: true
            - name: pyext
              mountPath: /usr/share/postgresql/17/extension
              subPath: ext
              readOnly: true
            - name: pyext
              mountPath: /usr/lib/python3.13
              subPath: pylib
              readOnly: true
            - name: pyext
              mountPath: /etc/python3.13
              subPath: pyetc
              readOnly: true
            - name: pyext
              mountPath: /usr/local/lib/pgextra
              subPath: rtlib
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-primary-data
        - name: hba-config
          configMap:
            name: postgres-primary-hba
        - name: pyext
          emptyDir: {}

---
