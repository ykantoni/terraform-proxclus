# 6. Service (ClusterIP; swap type to LoadBalancer for an external IP from Cilium's pool)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: postgres-primary
spec:
  selector:
    app: postgres-primary
  type: LoadBalancer
  ports:
    - port: 5432
      targetPort: 5432


---
apiVersion: v1
kind: Service
metadata:
  name: postgres-standby
  namespace: postgres-standby
spec:
  selector:
    app: postgres-standby
  type: LoadBalancer
  ports:
    - port: 45432
      targetPort: 5432

