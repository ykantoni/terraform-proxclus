---
# local_sensitive_file.kubeconfig equivalent. Fetched once — delete
# kubeconfig_path by hand to force a refresh (the same manual-refresh model
# the migration plan documents as the equivalent of a Terraform `-replace`).

- name: Ensure the kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"

- name: Write kubeconfig from the bootstrap node
  ansible.builtin.command:
    cmd: >-
      talosctl kubeconfig {{ kubeconfig_path }}
      -n {{ hostvars[groups['controlplane'][0]].ip }}
      -e {{ hostvars[groups['controlplane'][0]].ip }}
      --talosconfig {{ talos_gen_dir }}/talosconfig
    creates: "{{ kubeconfig_path }}"

- name: Restrict kubeconfig permissions
  ansible.builtin.file:
    path: "{{ kubeconfig_path }}"
    mode: "0600"
