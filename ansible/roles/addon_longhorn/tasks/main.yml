---
# Equivalent to modules/addons/longhorn/main.tf. The namespace is managed
# separately from the Helm release (not create_namespace: true) for the same
# reason as there: Helm records a release's Secret in its target namespace
# before applying any of that release's own manifests, so a chart cannot
# create the namespace it installs into without a resulting ownership
# conflict.
#
# Needs the matching /var/lib/longhorn kubelet extraMounts patch on every
# node's Talos machine configuration — see
# roles/talos_bootstrap/tasks/apply_config.yml, gated on this same
# enable_longhorn flag.

- name: Create the Longhorn namespace (privileged pod-security labels)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ longhorn_namespace }}"
        labels:
          # Longhorn's engine and CSI plugin pods mount host block devices
          # and /var/lib/longhorn directly, which the restricted Pod Security
          # Standard forbids.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

- name: Install Longhorn
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: longhorn
    chart_ref: longhorn
    chart_repo_url: "https://charts.longhorn.io"
    chart_version: "{{ longhorn_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    wait: true
    timeout: "{{ longhorn_helm_timeout }}s"
    values:
      persistence:
        defaultClass: true
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
        defaultFsType: ext4
      defaultSettings:
        defaultDataPath: "{{ longhorn_data_path }}"
