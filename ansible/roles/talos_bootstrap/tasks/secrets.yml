---
# talos_machine_secrets equivalent. DISASTER-RECOVERY NOTE: never delete or
# regenerate this file as part of the normal flow — a fresh run mints a
# brand-new cluster CA incompatible with every already-issued node
# certificate. When adopting an already-running cluster (migration plan
# Phase 2), extract the existing secrets from Terraform's own state first
# (`terraform state show module.talos_cluster.talos_machine_secrets.this`)
# and pre-seed this exact path *before* ever running this role, so the
# `creates:` guard below sees it already present and never touches it.

- name: Ensure the Talos secrets directory exists
  ansible.builtin.file:
    path: "{{ talos_secrets_path | dirname }}"
    state: directory
    mode: "0700"

- name: Generate the Talos secrets bundle
  ansible.builtin.command:
    cmd: >-
      talosctl gen secrets
      --talos-version {{ talos_version }}
      -o {{ talos_secrets_path }}
    creates: "{{ talos_secrets_path }}"
