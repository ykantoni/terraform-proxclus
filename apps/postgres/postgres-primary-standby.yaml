# 1. Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-primary

---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-standby


# 2. Credentials (generate a random password, or swap in your own)
---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: OFIwSFUrZE
  POSTGRES_USER: yurick
kind: Secret
metadata:
  name: postgres-primary-credentials
  namespace: postgres-primary
type: Opaque

---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: OFIwSFUrZE
  POSTGRES_USER: yurick
kind: Secret
metadata:
  name: postgres-standby-credentials
  namespace: postgres-standby
type: Opaque

# 3. pg_hba.conf — declared here instead of hand-edited in the running pod,
#    so it survives pod/PVC recreation and changes go through `kubectl apply`.
#    Mounted as a directory (not subPath) so ConfigMap edits actually
#    propagate into the pod; Postgres still needs a reload to pick them up:
#      kubectl exec -n postgres-primary postgres-primary-0 -- \
#        psql -U yurick -c "SELECT pg_reload_conf();"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-primary-hba
  namespace: postgres-primary
data:
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS          METHOD
    local   all       all                    trust
    host    all       all   127.0.0.1/32     trust
    host    all       all   ::1/128          trust

    # Trusted LAN / gateway hosts — password-authenticated, not open trust
    host    all       all   192.168.1.0/24   scram-sha-256
    host    all       all   172.19.64.1/32   scram-sha-256

    # Replication
    local   replication  all                 trust
    host    replication  all  127.0.0.1/32   trust
    host    replication  all  ::1/128        trust

    # Everything else: password required
    host    all       all   all              scram-sha-256

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-standby-hba
  namespace: postgres-standby
data:
  pg_hba.conf: |
    # TYPE  DATABASE  USER  ADDRESS          METHOD
    local   all       all                    trust
    host    all       all   127.0.0.1/32     trust
    host    all       all   ::1/128          trust

    # Trusted LAN / gateway hosts — password-authenticated, not open trust
    host    all       all   192.168.1.0/24   scram-sha-256
    host    all       all   172.19.64.1/32   scram-sha-256

    # Replication
    local   replication  all                 trust
    host    replication  all  127.0.0.1/32   trust
    host    replication  all  ::1/128        trust

    # Everything else: password required
    host    all       all   all              scram-sha-256


# 4. PVC — uses the cluster's default StorageClass (longhorn)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-data
  namespace: postgres-primary
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-standby-data
  namespace: postgres-standby
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi


# 5. Deployment
#
#    Each StatefulSet's initContainer apt-get installs postgresql-plpython3-17
#    (+ its python3/libexpat deps) into a shared emptyDir, then the main
#    container mounts just those specific files back at their original
#    absolute paths — never a whole real system directory, so nothing already
#    living in e.g. /usr/lib/postgresql/17/lib or the extension dir gets
#    hidden. Verified against this exact image (postgres:17, Debian
#    trixie/13, Python 3.13.5, postgresql-plpython3-17 17.11) by installing it
#    in a scratch pod and confirming CREATE EXTENSION plpython3u loads and
#    runs. If a postgres:17 image rebuild ever bumps the bundled Python minor
#    version, the hardcoded "3.13" paths below need to move with it — check
#    with `kubectl exec <pod> -c install-plpython3 -- python3 --version`
#    (add a temporary `sleep infinity` to the args to keep it alive to check).
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      # Pins the pod to the same non-root "postgres" user (uid/gid 999) the
      # official image already drops to internally via gosu — satisfies the
      # "restricted" PodSecurity standard instead of starting as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-plpython3
          image: postgres:17
          # Needs root to apt-get install — overrides the pod-level uid 999
          # pin above just for this container. Triggers the same "restricted"
          # PodSecurity warning the main container used to hit; harmless here
          # since it's advisory-only in this cluster (see securityContext
          # comment on this pod above).
          # No capabilities.drop here: apt-get needs CAP_SETUID/CAP_SETGID
          # (root -> its own "_apt" sandbox user) to fetch packages, so
          # dropping ALL breaks it — "Method http has died unexpectedly!".
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends postgresql-plpython3-17
              mkdir -p /pyext/pglib /pyext/ext /pyext/pylib /pyext/pyetc /pyext/rtlib
              cp -a /usr/lib/postgresql/17/lib/plpython3.so /pyext/pglib/
              cp -a /usr/share/postgresql/17/extension/plpython3u.control \
                    /usr/share/postgresql/17/extension/plpython3u--1.0.sql /pyext/ext/
              cp -a /usr/lib/python3.13/. /pyext/pylib/
              cp -a /etc/python3.13/. /pyext/pyetc/
              cp -a /usr/lib/x86_64-linux-gnu/libpython3.13.so* \
                    /usr/lib/x86_64-linux-gnu/libexpat.so* /pyext/rtlib/
          volumeMounts:
            - name: pyext
              mountPath: /pyext
      containers:
        - name: postgres
          image: postgres:17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-primary-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib/pgextra
          args: ["-c", "hba_file=/etc/postgresql/custom/pg_hba.conf"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba-config
              mountPath: /etc/postgresql/custom
              readOnly: true
            - name: pyext
              mountPath: /usr/lib/postgresql/17/lib/plpython3.so
              subPath: pglib/plpython3.so
              readOnly: true
            - name: pyext
              mountPath: /usr/share/postgresql/17/extension/plpython3u.control
              subPath: ext/plpython3u.control
              readOnly: true
            - name: pyext
              mountPath: /usr/share/postgresql/17/extension/plpython3u--1.0.sql
              subPath: ext/plpython3u--1.0.sql
              readOnly: true
            - name: pyext
              mountPath: /usr/lib/python3.13
              subPath: pylib
              readOnly: true
            - name: pyext
              mountPath: /etc/python3.13
              subPath: pyetc
              readOnly: true
            - name: pyext
              mountPath: /usr/local/lib/pgextra
              subPath: rtlib
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-primary-data
        - name: hba-config
          configMap:
            name: postgres-primary-hba
        - name: pyext
          emptyDir: {}

