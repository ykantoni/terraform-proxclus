# 1. Namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-primary

---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-standby


# 2. Credentials (generate a random password, or swap in your own)
---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: OFIwSFUrZEcvNTFoUC9TWg==
  POSTGRES_USER: app
kind: Secret
metadata:
  name: postgres-primary-credentials
  namespace: postgres-primary
type: Opaque

---
apiVersion: v1
stringData:
  POSTGRES_DB: app
  POSTGRES_PASSWORD: dU5CelIwUlFmYlFFOTdHVw==
  POSTGRES_USER: app
kind: Secret
metadata:
  name: postgres-standby-credentials
  namespace: postgres-standby
type: Opaque

# 3. PVC — uses the cluster's default StorageClass (longhorn)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-data
  namespace: postgres-primary
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-standby-data
  namespace: postgres-standby
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi


# 4. Deployment
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: postgres-primary-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-primary-data

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-standby
  namespace: postgres-standby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-standby
  template:
    metadata:
      labels:
        app: postgres-standby
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: postgres-standby-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-standby-data


# 5. Service (ClusterIP; swap type to LoadBalancer for an external IP from Cilium's pool)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: postgres-primary
spec:
  selector:
    app: postgres-primary
  type: LoadBalancer
  ports:
    - port: 5432
      targetPort: 5432


---
apiVersion: v1
kind: Service
metadata:
  name: postgres-standby
  namespace: postgres-standby
spec:
  selector:
    app: postgres-standby
  type: LoadBalancer
  ports:
    - port: 45432
      targetPort: 5432

