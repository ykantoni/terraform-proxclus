name: Terraform

on:
  pull_request:
  push:
    branches:
      - main
      - github

jobs:
  terraform:
    runs-on:
      - self-hosted
      - linux
      - terraform
      - proxmox

    env:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      KUBECONFIG: /home/github-runner/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check Terraform
        run: |
          which terraform
          terraform version

      - name: Check Proxmox credentials
        run: |
          test -n "$PROXMOX_VE_ENDPOINT"
          test -n "$PROXMOX_VE_API_TOKEN"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
