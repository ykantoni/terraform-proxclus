# Static inventory: 6 fixed nodes (1 Proxmox host, 1 controlplane, 5 workers).
# No dynamic inventory plugin — the fleet is small and changes rarely enough
# that hand-maintained host_vars (mirroring terraform.tfvars' `nodes` map)
# stay easier to read and diff than a dynamic Proxmox API query.
#
# IMPORTANT: Talos nodes run no SSH daemon (an immutable, API-only OS) — every
# task that targets `talos_nodes` runs LOCALLY on the control node and talks
# to the node over the Talos API via `talosctl -n <ip> -e <ip>`, never SSH.
# `ansible_connection: local` on that group is what makes a play targeting
# talos_nodes iterate once per inventory host *on the control machine*,
# reading each host's own host_vars — the equivalent of Terraform's
# `for_each = var.nodes`. Do not add `ansible_user`/SSH keys to these hosts.
all:
  children:
    proxmox_hosts:
      hosts:
        jupiter:
          ansible_connection: local

    talos_nodes:
      vars:
        ansible_connection: local
      children:
        controlplane:
          hosts:
            cp1: {}
        workers:
          hosts:
            w1: {}
            w2: {}
            w3: {}
            w4: {}
            w5: {}
